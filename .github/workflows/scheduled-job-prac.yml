name: Daily build Practice
on:
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Show Current Time and Date
        run: date -u
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup node-json
        uses: actions/setup-node@v5
        with:
          node-version: '20.19.0'

      - name: Install Dependencies
        run: npm install
           